<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfterCare - Log in</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">AfterCare</span>
    </div>
    <p class="auth-tagline">Your discharge instructions, organized into a daily plan you can check off.</p>

    <section class="card auth-card" aria-labelledby="authTitle">
      <h1 id="authTitle" class="auth-title">Log in or create an account</h1>
      <form id="authForm" class="stack" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="50" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" aria-describedby="passwordHint">
          <p id="passwordHint" class="field-hint">At least 8 characters.</p>
        </div>
        <p id="authMsg" class="form-error" role="alert" hidden></p>
        <div class="auth-actions">
          <button id="loginBtn" type="submit" class="btn btn-primary">Log in</button>
          <button id="signupBtn" type="button" class="btn btn-secondary">Create account</button>
        </div>
      </form>
    </section>
  </main>
  <footer class="disclaimer">AfterCare is a class project, not medical advice. In an emergency, call 911.</footer>
  <script type="module" src="/static/login.js"></script>
</body>
</html>
